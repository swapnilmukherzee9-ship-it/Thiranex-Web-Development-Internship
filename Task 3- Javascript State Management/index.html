<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Advanced To Do List Application">
<meta name="keywords" content="To Do List, JavaScript, CRUD, Local Storage">
<meta name="author" content="Swapnil Mukherzee">
<title>Advanced To Do List</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
<header>
<h1>Advanced To-Do List</h1>
<p>JavaScript Logic & State Management</p>
</header>

<section class="todo-box">
<div class="input-group">
<input type="text"
id="taskInput"
placeholder="Enter a new task..."
autocomplete="off">
<button id="addTask"> Add Task </button>
</div>

<div class="filters">
<button class="filter-btn active" data-filter="all"> All </button>
<button class="filter-btn" data-filter="active"> Active </button>
<button class="filter-btn" data-filter="completed"> Completed </button>
</div>

<ul id="taskList">
</ul>
</section>
<div class="bottom-bar">
<div class="task-info">
<span id="taskCount"> 0 Tasks </span>
</div>

<div class="actions">
<button id="clearCompleted">
Clear Completed
</button>
</div>
</div>
</div>

<footer>
<p> © 2026 Swapnil Mukherzee | Advanced JavaScript To-Do List </p>
</footer>
<script src="script.js"></script>
</body>
</html>
