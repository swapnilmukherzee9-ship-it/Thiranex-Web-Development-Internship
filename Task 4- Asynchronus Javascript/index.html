<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Professional Weather Dashboard using Fetch API">
<meta name="keywords" content="Weather Dashboard, JavaScript, REST API, Async Await">
<meta name="author" content="Swapnil Mukherzee">

<title>Weather Dashboard | Swapnil Mukherzee</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="container">
<header>
<h1>Weather Dashboard</h1>
<p>Asynchronous JavaScript & RESTful APIs</p>
</header>

<section class="search-section">
<div class="search-box">
<input type="text"
id="cityInput"
placeholder="Enter City Name..."
autocomplete="off">
<button id="searchBtn"> Search </button>
</div>
<p id="errorMessage"></p>
</section>

<section class="weather-card">
<div class="top-area">
<div>
<h2 id="cityName"> Search a City </h2>
<p id="country"></p>
</div>

<div>
<img id="weatherIcon"
src=""
alt="Weather Icon">
</div>
</div>

<div class="weather-main">
<h1 id="temperature"></h1>
<p id="condition"></p>
</div>

<div class="weather-details">
<div class="detail-card">
<h3>Feels Like</h3>
<p id="feelsLike"></p>
</div>

<div class="detail-card">
<h3>Humidity</h3>
<p id="humidity"></p>
</div>
<div class="detail-card">
<h3>Wind Speed</h3>
<p id="windSpeed"></p>
</div>

<div class="detail-card">
<h3>Pressure</h3>
<p id="pressure"></p>
</div>
<div class="detail-card">
<h3>Visibility</h3>
<p id="visibility"></p>
</div>

<div class="detail-card">
<h3>Cloudiness</h3>
<p id="clouds"></p>
</div>
<div class="detail-card">
<h3>Sunrise</h3>
<p id="sunrise"></p>
</div>

<div class="detail-card">
<h3>Sunset</h3>
<p id="sunset"></p>
</div>
</div>

<section class="extra-info">
<div class="extra-card">
<h3>Current Date</h3>
<p id="currentDate"></p>
</div>

<div class="extra-card">
<h3>Current Time</h3>
<p id="currentTime"></p>
</div>
</section>

<footer>
<p>© 2026 Swapnil Mukherzee | Weather Dashboard</p>
</footer>
</div>
<script src="script.js"></script>
</body>
</html>
